  <text x="108" y="584" fill="#f6c85f" font-family="Arial, sans-serif" font-size="23">[SERIES]</text>
  <text x="785" y="584" fill="#fff4d6" font-family="Arial, sans-serif" font-size="20">[DECORATION]</text>
  <text x="72" y="690" fill="#9aa0a6" font-family="Arial, sans-serif" font-size="16">SAFE AREA · 6–10% LOGO · ONE FOCAL SUBJECT</text>
